<title>GoLehighAcres Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">

<style>
  /* Layout: the page never scrolls. A fixed full-screen viewport holds a wall of 6 mirrored rows that pans in both axes by dragging (inertia), wheel or arrow keys. Tiles near the centre are larger and brighter. Tapping a tile plays it in place. */
  :root {
    --bg: #0A1D12;
    --bg-2: #0F2A1A;
    --gold: #E3A92B;
    --gold-dim: rgba(227, 169, 43, 0.4);
    --coral: #FF5A5F;
    --ink: #F1F4EA;
    --muted: #9DB1A1;
    --h: clamp(160px, 28vh, 300px);
    --gap: clamp(12px, 2vh, 24px);
    --font: 'Jost', 'Futura', 'Segoe UI', system-ui, sans-serif;
    --gutter: clamp(16px, 4vw, 56px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg) 62%), var(--bg); color: var(--ink); font-family: var(--font); font-weight: 300; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .mark { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 0; text-align: center; font-size: clamp(3rem, 13vw, 11rem); font-weight: 400; letter-spacing: 0.04em; white-space: nowrap; color: transparent; -webkit-text-stroke: 1px rgba(227, 169, 43, 0.22); pointer-events: none; user-select: none; }

  header { position: fixed; z-index: 20; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px var(--gutter); background: linear-gradient(var(--bg), transparent); pointer-events: none; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; letter-spacing: 0.04em; font-weight: 500; }
  .logo svg { width: 44px; height: 24px; flex: none; }
  .logo em { font-style: normal; color: var(--coral); }
  .logo b { font-weight: 500; color: var(--ink); }
  .count { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }

  .bar { position: fixed; z-index: 20; bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0; display: flex; justify-content: space-between; gap: 16px; padding: 14px var(--gutter); background: linear-gradient(transparent, var(--bg)); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }

  /* Pan viewport */
  .viewport { position: fixed; inset: 0; z-index: 1; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .viewport.drag { cursor: grabbing; }
  .wall { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: var(--gap); padding: 120px 120px 120px; will-change: transform; }
  .row { display: flex; align-items: center; gap: var(--gap); height: var(--h); flex: none; }

  .tile { position: relative; flex: none; display: block; overflow: hidden; border: 1px solid rgba(227, 169, 43, 0.3); border-radius: 3px; background: #0c2217; transition: transform .45s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .3s; -webkit-user-drag: none; }
  .tile.P { height: var(--h); aspect-ratio: 9 / 16; }
  .tile.L { height: calc(var(--h) * 0.62); aspect-ratio: 16 / 10; }
  .tile .bg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; background: var(--c); }
  .tile .bg::before { content: ''; position: absolute; inset: 0; background: linear-gradient(150deg, rgba(255,255,255,.22), transparent 55%); }
  .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .num { position: relative; font-size: clamp(0.8rem, 1.4vw, 1.2rem); font-weight: 500; letter-spacing: 0.12em; color: rgba(255,255,255,.78); }
  .tag { position: absolute; right: 0; bottom: 0; padding: 5px 10px; font-size: clamp(0.62rem, 0.9vw, 0.78rem); font-weight: 500; letter-spacing: 0.04em; }
  .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0; display: flex; align-items: center; gap: 8px; padding: 7px 14px; border: 1px solid var(--gold-dim); border-radius: 999px; background: rgba(10, 29, 18, .72); backdrop-filter: blur(6px); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; transition: opacity .25s, transform .25s; pointer-events: none; }
  .tile:hover, .tile:focus-visible { border-color: var(--gold); }
  .tile:hover .hint, .tile:focus-visible .hint { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .viewport.drag .hint { opacity: 0 !important; }

  .tile.playing { z-index: 6; transform: scale(1.6); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(227,169,43,.28); }
  .tile.playing .hint, .tile.playing .tag { display: none; }
  .live { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 12px; background: linear-gradient(transparent 35%, rgba(0,0,0,.65)); pointer-events: none; }
  .live span { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .live span::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #E5604D; animation: pulse 1.1s ease-in-out infinite; flex: none; }
  .live i { display: block; height: 2px; background: rgba(255,255,255,.25); position: relative; overflow: hidden; }
  .live i::after { content: ''; position: absolute; inset: 0; background: var(--gold); transform-origin: left; animation: prog 12s linear infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (max-width: 700px) {
    :root { --h: clamp(150px, 26vh, 240px); }
    .tile.playing { transform: scale(1.35); }
    .bar span:last-child { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .live span::before, .live i::after { animation: none; }
  }
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="mark" aria-hidden="true">Lehigh Acres</div>

<header>
  <span class="logo">
    <svg viewBox="0 0 44 24" aria-hidden="true" fill="none" stroke-width="5">
      <path d="M12 3a9 9 0 0 0-9 9" stroke="#2E7D55"/><path d="M3 12a9 9 0 0 0 9 9" stroke="#6BAA85"/><path d="M12 21h3" stroke="#A4D19B"/>
      <path d="M31 3a9 9 0 0 1 9 9" stroke="#7A4A9A"/><path d="M40 12a9 9 0 0 1-9 9" stroke="#2B8ED0"/><path d="M31 3h-3" stroke="#E3A92B"/>
      <path d="M14 12h14" stroke="#0F5A3C" stroke-width="4"/>
    </svg>
    <span><em>GO</em><b>LehighAcres</b></span>
  </span>
  <span class="count" id="count"></span>
</header>

<div class="viewport" id="viewport" role="region" aria-label="Pared de videos de Lehigh Acres. Arrastra para explorar.">
  <main class="wall" id="wall"></main>
</div>

<div class="bar"><span>Arrastra para explorar · toca un video para verlo aquí</span><span>Proyecto independiente · la vivienda se marca como publicidad</span></div>

<script>
  /* Edit this list: video = URL of the video file, img = poster image. Empty fields show the numbered colour block. */
  var CATS = ['Comercios', 'Empleo', 'Eventos', 'Vivienda', 'Noticias', 'Futuro', 'Turismo', 'Comunidad'];
  var COLORS = ['#2E7D55', '#CC7A3A', '#2B5BA8', '#7A4A9A', '#C99A22', '#2B8ED0'];
  var TAGC = { Comercios: ['#E3A92B', '#1B1608'], Empleo: ['#2B8ED0', '#FFFFFF'], Eventos: ['#CC7A3A', '#FFFFFF'], Vivienda: ['#2E7D55', '#FFFFFF'], Noticias: ['#5C6FB6', '#FFFFFF'], Futuro: ['#7A4A9A', '#FFFFFF'], Turismo: ['#A4D19B', '#10200F'], Comunidad: ['#FF5A5F', '#FFFFFF'] };
  var ROWS = 6, COLS = 9;   /* odd COLS keeps every row mirrored left to right */
  var TILES = [];
  for (var k = 0; k < ROWS * COLS; k++) TILES.push({ title: '', cat: CATS[k % CATS.length], img: '', video: '' });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var vp = document.getElementById('viewport'), wall = document.getElementById('wall');
  var tiles = [], current = null;
  document.getElementById('count').textContent = ROWS + ' filas · ' + (ROWS * COLS) + ' videos';

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  for (var r = 0; r < ROWS; r++) {
    var row = document.createElement('div');
    row.className = 'row';
    for (var c = 0; c < COLS; c++) {
      var idx = r * COLS + c, d = TILES[idx];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile ' + (((r + c) % 2 === 1) ? 'P' : 'L');
      b.dataset.i = idx;
      b.setAttribute('aria-label', 'Reproducir video ' + (idx + 1) + (d.title ? ': ' + d.title : ''));
      b.innerHTML =
        '<span class="bg" style="--c:' + COLORS[(r + c) % COLORS.length] + '">' + (d.img ? '<img src="' + d.img + '" alt="">' : '') +
        '<span class="num">VIDEO ' + pad(idx + 1) + '</span></span>' +
        '<span class="tag" style="background:' + TAGC[d.cat][0] + ';color:' + TAGC[d.cat][1] + '">' + d.cat + '</span>' +
        '<span class="hint">&#9654; Reproducir</span>';
      row.appendChild(b);
      tiles.push(b);
    }
    wall.appendChild(row);
  }

  /* Playback in place */
  function stop() {
    if (current === null) return;
    var t = tiles[current];
    t.classList.remove('playing');
    var v = t.querySelector('video'); if (v) { v.pause(); v.remove(); }
    var l = t.querySelector('.live'); if (l) l.remove();
    current = null;
    focus();
  }
  function play(i) {
    stop();
    var t = tiles[i], d = TILES[i];
    t.classList.add('playing');
    t.style.scale = ''; t.style.opacity = '';
    if (d.video) {
      var v = document.createElement('video');
      v.src = d.video; v.playsInline = true; v.autoplay = true;
      v.addEventListener('ended', stop);
      t.appendChild(v);
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    } else {
      var l = document.createElement('span');
      l.className = 'live';
      l.innerHTML = '<span>Reproduciendo · sin archivo</span><i></i>';
      t.appendChild(l);
    }
    current = i;
  }

  /* Panning */
  var x = 0, y = 0, vx = 0, vy = 0, W = 0, H = 0, VW = 0, VH = 0;
  var dragging = false, moved = false, sx = 0, sy = 0, lx = 0, ly = 0, raf = 0;
  var cx = [], cy = [];

  function measure() {
    VW = vp.clientWidth; VH = vp.clientHeight;
    var wasX = x, wasY = y;
    wall.style.transform = 'translate3d(0,0,0)';
    W = wall.offsetWidth; H = wall.offsetHeight;
    var wr = wall.getBoundingClientRect();
    tiles.forEach(function (t, i) {
      var r = t.getBoundingClientRect();
      cx[i] = r.left - wr.left + r.width / 2; cy[i] = r.top - wr.top + r.height / 2;
    });
    if (!measure.done) { x = (VW - W) / 2; y = (VH - H) / 2; measure.done = true; } else { x = wasX; y = wasY; }
    clamp(); apply();
  }
  function clamp() {
    var pad = 60;
    x = W <= VW ? (VW - W) / 2 : Math.max(VW - W - pad, Math.min(pad, x));
    y = H <= VH ? (VH - H) / 2 : Math.max(VH - H - pad, Math.min(pad, y));
  }
  function apply() {
    wall.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    focus();
  }
  /* Tiles near the screen centre are larger and brighter; the falloff is the same in every direction. */
  function focus() {
    for (var i = 0; i < tiles.length; i++) {
      if (i === current) continue;
      var dx = (cx[i] + x - VW / 2) / VW, dy = (cy[i] + y - VH / 2) / VH;
      var k = Math.min(1, Math.sqrt(dx * dx + dy * dy) * 1.5);
      tiles[i].style.scale = (1 - 0.22 * k).toFixed(3);
      tiles[i].style.opacity = (1 - 0.6 * k).toFixed(3);
    }
  }
  function loop() {
    if (!dragging) {
      x += vx; y += vy; vx *= 0.93; vy *= 0.93;
      var ox = x, oy = y; clamp();
      if (ox !== x) vx = 0; if (oy !== y) vy = 0;
      apply();
      if (Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) { raf = 0; return; }
    }
    raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  vp.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragging = true; moved = false; sx = lx = e.clientX; sy = ly = e.clientY; vx = vy = 0;
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { moved = true; vp.classList.add('drag'); }
    if (!moved) return;
    var dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    x += dx; y += dy; vx = dx; vy = dy; clamp(); apply();
  });
  function release() { if (!dragging) return; dragging = false; vp.classList.remove('drag'); if (moved) kick(); }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  /* A drag never counts as a click on a tile. */
  vp.addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (!t || moved) { moved = false; return; }
    var i = +t.dataset.i;
    if (current === i) stop(); else play(i);
  }, true);

  vp.addEventListener('wheel', function (e) {
    e.preventDefault();
    x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX; y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY;
    vx = vy = 0; clamp(); apply();
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    var s = 90;
    if (e.key === 'Escape') { stop(); return; }
    if (e.key === 'ArrowLeft') { vx = s / 6; }
    else if (e.key === 'ArrowRight') { vx = -s / 6; }
    else if (e.key === 'ArrowUp') { vy = s / 6; }
    else if (e.key === 'ArrowDown') { vy = -s / 6; }
    else return;
    e.preventDefault(); kick();
  });

  window.addEventListener('resize', measure);
  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  /* Twinkling stars */
  var cv = document.getElementById('stars'), ctx = cv.getContext('2d'), stars = [];
  function sizeStars() {
    cv.width = window.innerWidth; cv.height = window.innerHeight; stars = [];
    for (var i = 0; i < 70; i++) stars.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6.28 });
  }
  function paint(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    stars.forEach(function (s) {
      ctx.globalAlpha = reduce ? 0.5 : 0.25 + 0.5 * Math.abs(Math.sin(t / 1500 + s.p));
      ctx.fillStyle = '#E3A92B';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    });
    if (!reduce) requestAnimationFrame(paint);
  }
  sizeStars(); window.addEventListener('resize', sizeStars); requestAnimationFrame(paint);
</script>
