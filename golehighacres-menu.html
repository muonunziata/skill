<style>
  /* Layout: fixed full-screen viewport, no page scroll. A wall of 6 mirrored rows pans by drag, wheel or keys, and wanders on its own when left alone. Hovering a tile previews it for 10 s without sound; clicking opens a popup player. A custom cursor signals that the wall can be grabbed. */
  :root {
    --bg: #0A1D12;
    --bg-2: #0F2A1A;
    --gold: #E3A92B;
    --gold-dim: rgba(227, 169, 43, 0.4);
    --coral: #FF5A5F;
    --ink: #F1F4EA;
    --muted: #9DB1A1;
    --h: clamp(160px, 28vh, 300px);
    --gap: clamp(12px, 2vh, 24px);
    --font: 'Jost', 'Futura', 'Segoe UI', system-ui, sans-serif;
    --gutter: clamp(16px, 4vw, 56px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg) 62%), var(--bg); color: var(--ink); font-family: var(--font); font-weight: 300; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .mark { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 0; text-align: center; font-size: clamp(3rem, 13vw, 11rem); font-weight: 400; letter-spacing: 0.04em; white-space: nowrap; color: transparent; -webkit-text-stroke: 1px rgba(227, 169, 43, 0.22); pointer-events: none; user-select: none; }

  header { position: fixed; z-index: 20; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px var(--gutter); background: linear-gradient(var(--bg), transparent); pointer-events: none; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; letter-spacing: 0.04em; font-weight: 500; }
  .logo svg { width: 44px; height: 24px; flex: none; }
  .logo em { font-style: normal; color: var(--coral); }
  .logo b { font-weight: 500; color: var(--ink); }
  .count { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
  .bar { position: fixed; z-index: 20; bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0; display: flex; justify-content: space-between; gap: 16px; padding: 14px var(--gutter); background: linear-gradient(transparent, var(--bg)); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }

  /* Pan viewport */
  .viewport { position: fixed; inset: 0; z-index: 1; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .viewport.fine, .viewport.fine .tile { cursor: none; }
  .wall { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: var(--gap); padding: 120px; will-change: transform; }
  .row { display: flex; align-items: center; gap: var(--gap); height: var(--h); flex: none; }

  .tile { position: relative; flex: none; display: block; overflow: hidden; border: 1px solid rgba(227, 169, 43, 0.3); border-radius: 3px; background: #0c2217; transition: border-color .3s, box-shadow .3s; -webkit-user-drag: none; }
  .tile.P { height: var(--h); aspect-ratio: 9 / 16; }
  .tile.L { height: calc(var(--h) * 0.62); aspect-ratio: 16 / 10; }
  .tile .bg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; background: var(--c); }
  .tile .bg::before { content: ''; position: absolute; inset: 0; background: linear-gradient(150deg, rgba(255,255,255,.22), transparent 55%); }
  .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .num { position: relative; font-size: clamp(0.8rem, 1.4vw, 1.2rem); font-weight: 500; letter-spacing: 0.12em; color: rgba(255,255,255,.78); }
  .tag { position: absolute; right: 0; bottom: 0; padding: 5px 10px; font-size: clamp(0.62rem, 0.9vw, 0.78rem); font-weight: 500; letter-spacing: 0.04em; }
  .tile:focus-visible, .tile.previewing { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 40px rgba(227,169,43,.3); }
  .live { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 10px; background: linear-gradient(transparent 40%, rgba(0,0,0,.6)); pointer-events: none; }
  .live span { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .live span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #E5604D; animation: pulse 1.1s ease-in-out infinite; flex: none; }
  .live i { display: block; height: 2px; background: rgba(255,255,255,.25); position: relative; overflow: hidden; }
  .live i::after { content: ''; position: absolute; inset: 0; background: var(--gold); transform-origin: left; animation: prog 10s linear forwards; }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Custom cursor */
  .cur { position: fixed; left: 0; top: 0; z-index: 70; pointer-events: none; opacity: 0; will-change: transform; }
  .cur.on { opacity: 1; }
  .cur .c { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: grid; place-items: center; min-width: 40px; height: 40px; padding: 0 16px; border: 1px solid var(--gold); border-radius: 999px; background: rgba(10, 29, 18, .55); backdrop-filter: blur(4px); color: var(--ink); font-size: 0.64rem; letter-spacing: 0.24em; text-transform: uppercase; white-space: nowrap; transition: min-width .25s, height .25s, background .25s, color .25s, padding .25s; }
  .cur[data-s="tile"] .c { min-width: 68px; height: 68px; padding: 0; border-radius: 50%; background: var(--gold); color: #1B1608; font-weight: 500; }
  .cur[data-s="grab"] .c { min-width: 30px; height: 30px; padding: 0; background: rgba(227, 169, 43, .35); font-size: 0; }
  .cur[data-s="off"] { opacity: 0; }

  /* Popup player */
  .modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgba(4, 12, 7, .86); backdrop-filter: blur(8px); animation: fade .25s ease-out; }
  .modal[hidden] { display: none; }
  .m-box { position: relative; display: grid; gap: 12px; animation: pop .3s cubic-bezier(.2,.7,.2,1); }
  .m-media { position: relative; overflow: hidden; border: 1px solid var(--gold); border-radius: 4px; background: #000; box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 80px rgba(227,169,43,.18); }
  .m-box.P .m-media { height: min(80vh, 780px); max-width: 92vw; aspect-ratio: 9 / 16; }
  .m-box.L .m-media { width: min(92vw, 1100px); max-height: 74vh; aspect-ratio: 16 / 9; }
  .m-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .m-ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; background: var(--c); }
  .m-ph b { font-size: clamp(1.4rem, 4vw, 2.6rem); font-weight: 500; letter-spacing: 0.1em; color: rgba(255,255,255,.8); }
  .m-ph small { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,.8); }
  .m-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .m-meta .t { padding: 4px 10px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .m-close { position: absolute; right: 0; top: -44px; width: 36px; height: 36px; border: 1px solid var(--gold-dim); border-radius: 50%; font-size: 1rem; transition: background .2s, color .2s; }
  .m-close:hover { background: var(--gold); color: #1B1608; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }

  @media (max-width: 700px) {
    :root { --h: clamp(150px, 26vh, 240px); }
    .bar span:last-child { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modal, .m-box { animation: none; }
    .live span::before, .live i::after { animation: none; }
  }
</style>

<script>
  /* Edit this list: video = URL of the video file, img = poster image. Empty fields show the numbered colour block. */
  var CATS = ['Comercios', 'Empleo', 'Eventos', 'Vivienda', 'Noticias', 'Futuro', 'Turismo', 'Comunidad'];
  var COLORS = ['#2E7D55', '#CC7A3A', '#2B5BA8', '#7A4A9A', '#C99A22', '#2B8ED0'];
  var TAGC = { Comercios: ['#E3A92B', '#1B1608'], Empleo: ['#2B8ED0', '#FFFFFF'], Eventos: ['#CC7A3A', '#FFFFFF'], Vivienda: ['#2E7D55', '#FFFFFF'], Noticias: ['#5C6FB6', '#FFFFFF'], Futuro: ['#7A4A9A', '#FFFFFF'], Turismo: ['#A4D19B', '#10200F'], Comunidad: ['#FF5A5F', '#FFFFFF'] };
  var ROWS = 6, COLS = 9;   /* odd COLS keeps every row mirrored left to right */
  var PREVIEW_MS = 10000, IDLE_MS = 1800;
  var TILES = [];
  for (var k = 0; k < ROWS * COLS; k++) TILES.push({ title: '', cat: CATS[k % CATS.length], img: '', video: '' });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = window.matchMedia('(pointer: fine)').matches;
  var vp = document.getElementById('viewport'), wall = document.getElementById('wall');
  var tiles = [], kinds = [], colors = [];
  document.getElementById('count').textContent = ROWS + ' filas · ' + (ROWS * COLS) + ' videos';
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function label(i) { return TILES[i].title || ('Video ' + pad(i + 1)); }

  for (var r = 0; r < ROWS; r++) {
    var row = document.createElement('div');
    row.className = 'row';
    for (var c = 0; c < COLS; c++) {
      var idx = r * COLS + c, d = TILES[idx], p = ((r + c) % 2 === 1);
      kinds[idx] = p ? 'P' : 'L'; colors[idx] = COLORS[(r + c) % COLORS.length];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile ' + kinds[idx];
      b.dataset.i = idx;
      b.setAttribute('aria-label', 'Abrir ' + label(idx));
      b.innerHTML =
        '<span class="bg" style="--c:' + colors[idx] + '">' + (d.img ? '<img src="' + d.img + '" alt="">' : '') +
        '<span class="num">VIDEO ' + pad(idx + 1) + '</span></span>' +
        '<span class="tag" style="background:' + TAGC[d.cat][0] + ';color:' + TAGC[d.cat][1] + '">' + d.cat + '</span>';
      row.appendChild(b);
      tiles.push(b);
    }
    wall.appendChild(row);
  }

  /* ---------- Hover preview: 10 s, no sound ---------- */
  var pvIndex = null, pvTimer = 0, hoverTile = false;
  function stopPreview() {
    clearTimeout(pvTimer);
    if (pvIndex === null) return;
    var t = tiles[pvIndex];
    t.classList.remove('previewing');
    var v = t.querySelector('video'); if (v) { v.pause(); v.remove(); }
    var l = t.querySelector('.live'); if (l) l.remove();
    pvIndex = null;
  }
  function startPreview(i) {
    if (pvIndex === i) return;
    stopPreview();
    var t = tiles[i], d = TILES[i];
    t.classList.add('previewing');
    if (d.video) {
      var v = document.createElement('video');
      v.muted = true; v.defaultMuted = true; v.playsInline = true; v.autoplay = true; v.src = d.video;
      t.appendChild(v);
      var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
    } else {
      var l = document.createElement('span');
      l.className = 'live';
      l.innerHTML = '<span>Vista previa · sin sonido</span><i></i>';
      t.appendChild(l);
    }
    pvIndex = i;
    pvTimer = setTimeout(stopPreview, PREVIEW_MS);
  }

  /* ---------- Popup player ---------- */
  var modal = document.getElementById('modal'), mBox = document.getElementById('mBox'), mMedia = document.getElementById('mMedia');
  var modalOpen = false, opener = null;
  function openModal(i) {
    stopPreview();
    var d = TILES[i];
    opener = tiles[i]; modalOpen = true;
    mBox.className = 'm-box ' + kinds[i];
    mMedia.innerHTML = '';
    if (d.video) {
      var v = document.createElement('video');
      v.src = d.video; v.controls = true; v.playsInline = true; v.autoplay = true;
      mMedia.appendChild(v);
      var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
    } else {
      mMedia.innerHTML = '<div class="m-ph" style="--c:' + colors[i] + '"><b>VIDEO ' + pad(i + 1) + '</b><small>Aquí se reproduce el video con sonido</small></div>';
    }
    document.getElementById('mTitle').textContent = label(i);
    var tg = document.getElementById('mTag');
    tg.textContent = d.cat; tg.style.background = TAGC[d.cat][0]; tg.style.color = TAGC[d.cat][1];
    modal.hidden = false; vp.inert = true;
    setCursor('off');
    document.getElementById('mClose').focus({ preventScroll: true });
  }
  function closeModal() {
    if (!modalOpen) return;
    var v = mMedia.querySelector('video'); if (v) v.pause();
    mMedia.innerHTML = '';
    modal.hidden = true; vp.inert = false; modalOpen = false;
    lastAct = performance.now();
    if (opener) opener.focus({ preventScroll: true });
  }
  document.getElementById('mClose').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  /* ---------- Pan, inertia and idle wandering ---------- */
  var x = 0, y = 0, vx = 0, vy = 0, dvx = 0, dvy = 0, W = 0, H = 0, VW = 0, VH = 0, PADPAN = 60;
  var dragging = false, moved = false, sx = 0, sy = 0, lx = 0, ly = 0, lastAct = performance.now();
  var cx = [], cy = [], tx = 0, ty = 0, tNext = 0, measured = false;

  function measure() {
    VW = vp.clientWidth; VH = vp.clientHeight;
    var keepX = x, keepY = y;
    wall.style.transform = 'translate3d(0,0,0)';
    W = wall.offsetWidth; H = wall.offsetHeight;
    var wr = wall.getBoundingClientRect();
    tiles.forEach(function (t, i) {
      var rc = t.getBoundingClientRect();
      cx[i] = rc.left - wr.left + rc.width / 2; cy[i] = rc.top - wr.top + rc.height / 2;
    });
    if (!measured) { x = (VW - W) / 2; y = (VH - H) / 2; measured = true; } else { x = keepX; y = keepY; }
    clamp(); apply();
  }
  function clamp() {
    var ox = x, oy = y;
    x = W <= VW ? (VW - W) / 2 : Math.max(VW - W - PADPAN, Math.min(PADPAN, x));
    y = H <= VH ? (VH - H) / 2 : Math.max(VH - H - PADPAN, Math.min(PADPAN, y));
    return ox !== x || oy !== y;
  }
  function apply() {
    wall.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    for (var i = 0; i < tiles.length; i++) {
      var dx = (cx[i] + x - VW / 2) / VW, dy = (cy[i] + y - VH / 2) / VH;
      var k = Math.min(1, Math.sqrt(dx * dx + dy * dy) * 1.5);
      tiles[i].style.scale = (1 - 0.22 * k).toFixed(3);
      tiles[i].style.opacity = (1 - 0.55 * k).toFixed(3);
    }
  }
  function pickTarget(now) {
    tx = W <= VW ? x : PADPAN + Math.random() * (VW - W - 2 * PADPAN);
    ty = H <= VH ? y : PADPAN + Math.random() * (VH - H - 2 * PADPAN);
    tNext = now + 5000 + Math.random() * 6000;
  }
  var last = performance.now();
  function loop(now) {
    var f = Math.min(3, (now - last) / 16.67); last = now;
    var px = x, py = y;
    if (dragging) {
      lastAct = now; dvx = dvy = 0;
    } else {
      var idle = !reduce && !modalOpen && !hoverTile && (now - lastAct > IDLE_MS);
      var wantX = 0, wantY = 0;
      if (idle) {
        if (now > tNext || Math.hypot(tx - x, ty - y) < 24) pickTarget(now);
        var ddx = tx - x, ddy = ty - y, dist = Math.hypot(ddx, ddy) || 1, sp = 0.55 * Math.min(1, dist / 220);
        wantX = ddx / dist * sp; wantY = ddy / dist * sp;
      }
      dvx += (wantX - dvx) * 0.03 * f; dvy += (wantY - dvy) * 0.03 * f;
      x += (vx + dvx) * f; y += (vy + dvy) * f;
      var decay = Math.pow(0.93, f); vx *= decay; vy *= decay;
      if (clamp()) { vx = vy = dvx = dvy = 0; if (idle) pickTarget(now); }
    }
    if (x !== px || y !== py) apply();
    requestAnimationFrame(loop);
  }

  /* ---------- Pointer handling ---------- */
  function touched() { lastAct = performance.now(); }
  vp.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragging = true; moved = false; sx = lx = e.clientX; sy = ly = e.clientY; vx = vy = 0; touched();
  });
  window.addEventListener('pointermove', function (e) {
    moveCursor(e);
    if (!dragging) return;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { moved = true; stopPreview(); setCursor('grab'); }
    if (!moved) return;
    var dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    x += dx; y += dy; vx = dx; vy = dy; clamp(); apply();
  });
  function release(e) {
    if (!dragging) return;
    dragging = false; touched();
    if (e && e.clientX !== undefined) setCursor(zone(e));
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  vp.addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (!t || moved) { moved = false; return; }
    openModal(+t.dataset.i);
  }, true);

  tiles.forEach(function (t) {
    t.addEventListener('pointerenter', function (e) {
      hoverTile = true;
      if (e.pointerType === 'mouse' && !dragging && !modalOpen) startPreview(+t.dataset.i);
    });
    t.addEventListener('pointerleave', function () { hoverTile = false; stopPreview(); });
    t.addEventListener('focus', function () {
      var i = +t.dataset.i; x = VW / 2 - cx[i]; y = VH / 2 - cy[i]; clamp(); apply(); touched();
    });
  });

  vp.addEventListener('wheel', function (e) {
    e.preventDefault(); touched();
    var h = e.shiftKey && !e.deltaX;
    x -= h ? e.deltaY : e.deltaX; y -= h ? 0 : e.deltaY;
    vx = vy = 0; clamp(); apply();
  }, { passive: false });
  vp.addEventListener('scroll', function () { vp.scrollTop = 0; vp.scrollLeft = 0; });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); stopPreview(); return; }
    if (modalOpen) return;
    var s = 15;
    if (e.key === 'ArrowLeft') vx = s; else if (e.key === 'ArrowRight') vx = -s;
    else if (e.key === 'ArrowUp') vy = s; else if (e.key === 'ArrowDown') vy = -s;
    else return;
    e.preventDefault(); touched();
  });

  /* ---------- Cursor ---------- */
  var cur = document.getElementById('cur'), curText = document.getElementById('curText');
  function setCursor(s) {
    cur.dataset.s = s;
    curText.textContent = s === 'drag' ? '‹ Arrastra ›' : (s === 'tile' ? '▶ Ver' : '');
  }
  function zone(e) { return e.target && e.target.closest && e.target.closest('.tile') ? 'tile' : 'drag'; }
  function moveCursor(e) {
    if (!fine || e.pointerType !== 'mouse' || modalOpen) return;
    cur.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    if (!vp.contains(e.target)) { cur.classList.remove('on'); return; }
    cur.classList.add('on');
    if (!moved || !dragging) { var z = zone(e); if (cur.dataset.s !== z) setCursor(z); }
  }
  if (fine) vp.classList.add('fine');
  document.addEventListener('pointerleave', function () { cur.classList.remove('on'); });
  setCursor('drag');

  window.addEventListener('resize', measure);
  measure(); pickTarget(performance.now());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  requestAnimationFrame(loop);

  /* ---------- Twinkling stars ---------- */
  var cv = document.getElementById('stars'), ctx = cv.getContext('2d'), stars = [];
  function sizeStars() {
    cv.width = window.innerWidth; cv.height = window.innerHeight; stars = [];
    for (var i = 0; i < 70; i++) stars.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6.28 });
  }
  function paint(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    stars.forEach(function (s) {
      ctx.globalAlpha = reduce ? 0.5 : 0.25 + 0.5 * Math.abs(Math.sin(t / 1500 + s.p));
      ctx.fillStyle = '#E3A92B';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    });
    if (!reduce) requestAnimationFrame(paint);
  }
  sizeStars(); window.addEventListener('resize', sizeStars); requestAnimationFrame(paint);
</script>
