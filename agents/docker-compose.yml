services:
  lehigh-agents:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /app/state
    volumes:
      # A named volume inherits the image's /app/state ownership (user "agent"); a ./state bind mount would be created
      # root-owned by Docker and the unprivileged container user could not open the SQLite memory.
      - state:/app/state

volumes:
  state:
