[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lehigh-agents"
version = "1.0.0"
description = "Research, writing and audit agents for the Lehigh News Hub WordPress plugin"
requires-python = ">=3.11"
dependencies = ["google-genai>=1.0", "python-dotenv>=1.0", "requests>=2.31"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]  # only when REDACCTOR_MODEL is a claude-* model
openai = ["openai>=1.50"]     # only when REDACCTOR_MODEL is a gpt-* / o* model
dev = ["pytest>=8"]

[project.scripts]
lehigh-agents = "lehigh_agents.cli:main"

[tool.setuptools.packages.find]
include = ["lehigh_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
