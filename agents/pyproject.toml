[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lehigh-agents"
version = "1.0.0"
description = "Research, writing and audit agents for the Lehigh News Hub WordPress plugin"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lehigh-agents = "lehigh_agents.cli:main"

[tool.setuptools.packages.find]
include = ["lehigh_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
